name = "skillshield-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
SCANNER_BASE_URL = "http://127.0.0.1:3100"
SCANNER_REQUEST_TIMEOUT_MS = "180000"
SCAN_QUEUE_MAX_ATTEMPTS = "31"
DISABLED_SOURCES = ""

[[r2_buckets]]
binding = "SKILLS_BUCKET"
bucket_name = "skillshield-skills"

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "skillshield-reports"

[[r2_buckets]]
binding = "META_BUCKET"
bucket_name = "skillshield-meta"

[[d1_databases]]
binding = "DB"
database_name = "skillshield-db"
database_id = "local-dev-placeholder"

[[queues.producers]]
queue = "scan-jobs"
binding = "SCAN_QUEUE"

[[queues.consumers]]
queue = "scan-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 30
retry_delay = 60
max_concurrency = 4

[env.production]
# zone_name is required because the cochat.ai zone uses Cloudflare's
# wildcard-host SSL-for-SaaS entitlement; without it the routes API rejects
# bare-string patterns ("you must specify the zone per route" 10082).
routes = [
  { pattern = "skillshield.cochat.ai/*", zone_name = "cochat.ai" }
]

[env.production.vars]
ENVIRONMENT = "production"
SCANNER_BASE_URL = "https://skillshield-scanner.fly.dev"
SCANNER_REQUEST_TIMEOUT_MS = "180000"
SCAN_QUEUE_MAX_ATTEMPTS = "31"
DISABLED_SOURCES = "clawhub"

[[env.production.r2_buckets]]
binding = "SKILLS_BUCKET"
bucket_name = "skillshield-skills"

[[env.production.r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "skillshield-reports"

[[env.production.r2_buckets]]
binding = "META_BUCKET"
bucket_name = "skillshield-meta"

[[env.production.d1_databases]]
binding = "DB"
database_name = "skillshield-db"
database_id = "70d1e92a-ccaa-4e84-bfc3-03ffb9966297"

[[env.production.queues.producers]]
queue = "scan-jobs"
binding = "SCAN_QUEUE"

[[env.production.queues.consumers]]
queue = "scan-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 30
retry_delay = 60
max_concurrency = 4
