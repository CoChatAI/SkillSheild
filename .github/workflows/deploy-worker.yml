name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker after validation passes.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker dependencies
        run: |
          pnpm --filter @skillshield/shared build
          pnpm --filter @skillshield/dashboard build
          pnpm --filter @skillshield/worker build

      - name: Typecheck Worker path
        run: |
          pnpm --filter @skillshield/shared typecheck
          pnpm --filter @skillshield/dashboard typecheck
          pnpm --filter @skillshield/worker typecheck

      - name: Test Worker path
        run: |
          pnpm --filter @skillshield/shared test
          pnpm --filter @skillshield/dashboard test
          pnpm --filter @skillshield/worker test

      - name: Validate Wrangler deployment config
        working-directory: packages/worker
        run: pnpm exec wrangler deploy --dry-run --env production --config wrangler.toml

  deploy:
    if: ${{ inputs.deploy }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker
        working-directory: packages/worker
        run: pnpm exec wrangler deploy --env production --config wrangler.toml
