name: Purge Queue

on:
  workflow_dispatch:
    inputs:
      queue_name:
        description: Cloudflare Queue name to purge.
        required: true
        default: scan-jobs
        type: string
      confirmation:
        description: Type the queue name again to confirm deletion of queued messages.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: purge-queue-${{ inputs.queue_name }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_NAME: ${{ inputs.queue_name }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Require exact queue confirmation
        run: test "$CONFIRMATION" = "$QUEUE_NAME"

      - name: Purge queue
        working-directory: packages/worker
        run: pnpm exec wrangler queues purge "$QUEUE_NAME" --force --config wrangler.toml
