name: One-shot — apply D1 migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: SQL file path (relative to repo root)
        required: true
        default: packages/worker/migrations/0001_add_category_and_installs_metadata.sql
        type: string
      env:
        description: Wrangler env to target
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply SQL file to remote D1
        working-directory: packages/worker
        run: |
          test -f "../../${{ inputs.file }}"
          pnpm exec wrangler d1 execute skillshield-db \
            --env "${{ inputs.env }}" \
            --remote \
            --file "../../${{ inputs.file }}"
