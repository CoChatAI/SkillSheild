# Skill Scanner – Scan Policy
# Customise this file to match your organisation's security bar.
# Only include sections you want to override; omitted sections
# will use the built-in defaults.

policy_name: default
policy_version: '1.0'
preset_base: balanced
hidden_files:
  benign_dotfiles:
  - .babelrc
  - .browserslistrc
  - .clang-format
  - .clang-tidy
  - .cursorignore
  - .cursorrules
  - .dockerignore
  - .editorconfig
  - .env.example
  - .env.sample
  - .env.template
  - .envrc
  - .eslintignore
  - .eslintrc
  - .eslintrc.js
  - .eslintrc.json
  - .eslintrc.yml
  - .flake8
  - .gitattributes
  - .gitignore
  - .gitkeep
  - .gitmodules
  - .goreleaser.yaml
  - .goreleaser.yml
  - .isort.cfg
  - .markdownlint.json
  - .markdownlintignore
  - .mcp.json
  - .mypy.ini
  - .node-version
  - .npmignore
  - .npmrc
  - .nvmrc
  - .postcssrc
  - .prettierignore
  - .prettierrc
  - .pylintrc
  - .python-version
  - .rubocop.yml
  - .ruby-version
  - .solhint.json
  - .stylelintignore
  - .stylelintrc
  - .tool-versions
  - .version
  - .yamllint
  - .yamllint.yml
  benign_dotdirs:
  - .cache
  - .circleci
  - .claude
  - .claude-plugin
  - .codex
  - .cursor
  - .data
  - .devcontainer
  - .docusaurus
  - .github
  - .gitlab
  - .husky
  - .idea
  - .lance
  - .leann
  - .lmdb
  - .next
  - .nuxt
  - .obsidian
  - .osgrep
  - .parcel-cache
  - .smithery
  - .storybook
  - .tmp
  - .vitepress
  - .vscode
pipeline:
  known_installer_domains:
  - astral.sh
  - brew.sh
  - bun.sh
  - deno.land
  - get.docker.com
  - get.pnpm.io
  - get.sdkman.io
  - get.volta.sh
  - getcomposer.org
  - install.python-poetry.org
  - mise.jdx.dev
  - nixos.org
  - proto.moonrepo.app
  - pyenv.run
  - raw.githubusercontent.com/nvm-sh
  - sh.rustup.rs
  - taskfile.dev
  benign_pipe_targets:
  - ps\s.*\|\s*grep
  - grep\s.*\|\s*grep\s+-v
  - cat\s.*\|\s*(sort|uniq|wc|head|tail|grep|cut|awk|sed)
  - find\s.*\|\s*(sort|head|wc|xargs\s+ls)
  - ls\s.*\|\s*(sort|head|grep|wc)
  - echo\s.*\|\s*(tr|sed|awk|cut|base64)
  - curl\s.*\|\s*(jq|python\s+-m\s+json\.tool|json_pp|yq|xmllint)
  doc_path_indicators:
  - doc
  - docs
  - examples
  - guides
  - references
  - tutorials
  demote_in_docs: true
  demote_instructional: true
  check_known_installers: true
  dedupe_equivalent_pipelines: true
  compound_fetch_require_download_intent: true
  compound_fetch_filter_api_requests: true
  compound_fetch_filter_shell_wrapped_fetch: true
  compound_fetch_exec_prefixes:
  - sudo
  - env
  - command
  - time
  - nohup
  - nice
  compound_fetch_exec_commands:
  - bash
  - sh
  - zsh
  - source
  - python
  - python3
  - node
  - .
  exfil_hints:
  - send
  - upload
  - transmit
  - webhook
  - slack
  - exfil
  - forward
  api_doc_tokens:
  - '@app.'
  - app.
  - router.
  - route
  - endpoint
rule_scoping:
  skillmd_and_scripts_only:
  - autonomy_abuse_generic
  - coercive_injection_generic
  skip_in_docs:
  - COMMAND_INJECTION_JS_CHILD_PROCESS
  - COMMAND_INJECTION_JS_FUNCTION_CONSTRUCTOR
  - DATA_EXFIL_JS_FS_ACCESS
  - DATA_EXFIL_JS_NETWORK
  - FIND_EXEC_PATTERN
  - GLOB_HIDDEN_FILE_TARGETING
  - PROMPT_INJECTION_IGNORE_INSTRUCTIONS
  - SECRET_CONNECTION_STRING
  - TOOL_ABUSE_SYSTEM_MODIFICATION
  - code_execution_generic
  - command_injection_generic
  - credential_harvesting_generic
  - script_injection_generic
  - system_manipulation_generic
  code_only:
  - prompt_injection_unicode_steganography
  - sql_injection_generic
  doc_path_indicators:
  - demos
  - docs
  - examples
  - fixtures
  - guides
  - indexes
  - patterns
  - references
  - rules
  - test
  - tutorials
  doc_filename_patterns:
  - security[_-]patterns|examples?|patterns?|samples?|demo|tutorial|guide|howto|cheatsheet
  dedupe_reference_aliases: true
  dedupe_duplicate_findings: true
  asset_prompt_injection_skip_in_docs: true
credentials:
  known_test_values:
  - api_key="sk-no-key-required"
  - api_key='sk-no-key-required'
  - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwiaWF0IjoxNTE2MjM5MDIyfQ
  - password="password"
  - password='password'
  - pk_test_TYooMQauvdEDq54NiTphI7jx
  - stripe_secret_test_placeholder
  placeholder_markers:
  - <insert
  - <your
  - change_me
  - changeme
  - dummy
  - example
  - placeholder
  - replace
  - sample
  - 'your '
  - your-
  - your_
system_cleanup:
  safe_rm_targets:
  - .cache
  - .next
  - .nuxt
  - .temp
  - .tmp
  - build
  - bundle.css
  - bundle.html
  - bundle.js
  - deriveddata
  - dist
  - node_modules
  - temp
  - tmp
file_classification:
  inert_extensions:
  - .bmp
  - .db
  - .eot
  - .gif
  - .ico
  - .jpeg
  - .jpg
  - .otf
  - .png
  - .pyc
  - .pyo
  - .sqlite
  - .sqlite3
  - .tiff
  - .ttf
  - .webp
  - .woff
  - .woff2
  structured_extensions:
  - .pdf
  - .svg
  archive_extensions:
  - .7z
  - .apk
  - .bz2
  - .docx
  - .gz
  - .jar
  - .odp
  - .ods
  - .odt
  - .pptx
  - .rar
  - .tar
  - .tar.gz
  - .tgz
  - .war
  - .xlsx
  - .xz
  - .zip
  code_extensions:
  - .bash
  - .js
  - .php
  - .pl
  - .py
  - .rb
  - .sh
  - .ts
  skip_inert_extensions: true
  allow_script_shebang_text_extensions: true
  script_shebang_extensions:
  - .bash
  - .js
  - .php
  - .pl
  - .py
  - .rb
  - .sh
  - .ts
file_limits:
  max_file_count: 100
  max_file_size_bytes: 5242880
  max_reference_depth: 5
  max_name_length: 64
  max_description_length: 1024
  min_description_length: 20
  max_yara_scan_file_size_bytes: 52428800
  max_loader_file_size_bytes: 10485760
analysis_thresholds:
  zerowidth_threshold_with_decode: 50
  zerowidth_threshold_alone: 200
  analyzability_low_risk: 90
  analyzability_medium_risk: 70
  min_dangerous_lines: 5
  min_confidence_pct: 80
  exception_handler_context_lines: 20
  short_match_max_chars: 2
  cyrillic_cjk_min_chars: 10
  homoglyph_filter_math_context: true
  homoglyph_math_aliases:
  - COMMON
  - GREEK
  max_regex_pattern_length: 1000
sensitive_files:
  patterns:
  - /etc/(?:passwd|shadow|hosts)
  - ~?/\.(?:ssh|aws|gnupg|config|env)
  - \.(?:env|pem|key|crt|p12|pfx)
  - (?:credentials|secrets?|tokens?|password)
  - \$(?:HOME|USER|SSH_AUTH_SOCK|AWS_)
command_safety:
  safe_commands:
  - ack
  - ag
  - b2sum
  - basename
  - cal
  - cat
  - cksum
  - column
  - comm
  - cut
  - date
  - diff
  - dir
  - dirname
  - echo
  - env
  - expand
  - 'false'
  - fd
  - file
  - fmt
  - fold
  - grep
  - groups
  - head
  - hostname
  - id
  - join
  - locate
  - ls
  - md5sum
  - nl
  - node
  - paste
  - printenv
  - printf
  - pwd
  - python
  - python3
  - readlink
  - realpath
  - rg
  - ruby
  - sha256sum
  - sha512sum
  - shasum
  - sort
  - stat
  - tail
  - tr
  - tree
  - 'true'
  - type
  - uname
  - unexpand
  - uniq
  - wc
  - where
  - whereis
  - which
  - whoami
  caution_commands:
  - apk
  - apt
  - apt-get
  - awk
  - brew
  - cargo
  - chgrp
  - chmod
  - chown
  - cmake
  - cp
  - dnf
  - dotnet
  - find
  - gawk
  - git
  - go
  - gradle
  - java
  - javac
  - less
  - ln
  - make
  - mkdir
  - more
  - mv
  - mvn
  - npm
  - pacman
  - perl
  - pip
  - pip3
  - rmdir
  - rustc
  - sed
  - touch
  - uv
  - yum
  risky_commands:
  - at
  - crontab
  - dd
  - docker
  - fdisk
  - iptables
  - kubectl
  - launchctl
  - mkfs
  - mount
  - nc
  - ncat
  - netcat
  - nft
  - nmap
  - podman
  - rm
  - rsync
  - scp
  - service
  - sftp
  - socat
  - ssh
  - systemctl
  - telnet
  - ufw
  - umount
  dangerous_commands:
  - base64
  - bash
  - csh
  - curl
  - dash
  - doas
  - eval
  - exec
  - fish
  - gpg
  - ksh
  - openssl
  - sh
  - source
  - su
  - sudo
  - tcsh
  - wget
  - zsh
  dangerous_arg_patterns:
  - \bpython[23]?\s+.*-c\s
  - \bnode\s+.*(?:-e|--eval)\s
  - \bruby\s+.*-e\s
  - \benv\s+.*(?:/bin/(?:ba)?sh|/bin/(?:z|da|fi)sh)
  - \bfind\s+.*-exec(?:dir)?\s
  - \b(?:less|more|man)\s+.*!\s*/bin/
  - \bpip[3]?\s+install\s+(?:--index-url|--extra-index-url|-i)\s
  - \bgit\s+(?:clone|remote\s+add)\s+.*[;&|]
analyzers:
  static: true
  bytecode: true
  pipeline: true
llm_analysis:
  max_instruction_body_chars: 20000
  max_code_file_chars: 15000
  max_referenced_file_chars: 10000
  max_total_prompt_chars: 100000
  max_output_tokens: 8192
  meta_budget_multiplier: 3.0
finding_output:
  dedupe_exact_findings: true
  dedupe_same_issue_per_location: true
  same_issue_preferred_analyzers:
  - meta_analyzer
  - llm_analyzer
  - meta
  - llm
  - behavioral
  - pipeline
  - static
  - yara
  - analyzability
  same_issue_collapse_within_analyzer: true
  annotate_same_path_rule_cooccurrence: true
  attach_policy_fingerprint: true
severity_overrides: []
disabled_rules: []
